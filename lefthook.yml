pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: npx biome check --no-errors-on-unmatched {staged_files}
    architecture:
      glob: "*.{ts,tsx}"
      run: node scripts/check-staged.mjs {staged_files}

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-message.mjs {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npm run test:run
    build:
      run: npm run build
