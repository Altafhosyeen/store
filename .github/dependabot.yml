version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      antd:
        patterns: ["antd", "@ant-design/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*", "typescript", "@biomejs/*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
