name: Bug
description: Report a bug or regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options:
        - Admin
        - Staff
        - Customer
        - All roles
        - Unauthenticated
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Data mode
      options:
        - Mock mode (VITE_ENABLE_MOCK=true)
        - Real backend
        - Both
  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      description: Which tests, screenshots, or commands should prove the fix?
